default_profile: wroom32

profiles:
  wroom32:
    fqbn: esp32-bluepad32:esp32:esp32:DebugLevel=info
    platforms:
      - platform: esp32-bluepad32:esp32 (4.1.0)
        platform_index_url: https://raw.githubusercontent.com/ricardoquesada/esp32-arduino-lib-builder/master/bluepad32_files/package_esp32_bluepad32_index.json
    libraries:
      - dir: ../../lib
  c3:
    fqbn: esp32-bluepad32:esp32:esp32c3:DebugLevel=info,CDCOnBoot=cdc
    platforms:
      - platform: esp32-bluepad32:esp32 (4.1.0)
        platform_index_url: https://raw.githubusercontent.com/ricardoquesada/esp32-arduino-lib-builder/master/bluepad32_files/package_esp32_bluepad32_index.json
    libraries:
      - dir: ../../lib
