default_profile: esp01

profiles:
  esp01:
    fqbn: esp8266:esp8266:generic:eesz=1M64,FlashMode=dout
    platforms:
      - platform: esp8266:esp8266 (3.1.2)
        platform_index_url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
    libraries:
      - dir: ../../lib
  esp32:
    fqbn: esp32-bluepad32:esp32:esp32
    platforms:
      - platform: esp32-bluepad32:esp32 (4.1.0)
        platform_index_url: https://raw.githubusercontent.com/ricardoquesada/esp32-arduino-lib-builder/master/bluepad32_files/package_esp32_bluepad32_index.json
    libraries:
      - dir: ../../lib
