name: Website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - lib/**
      - package.json
      - pnpm-lock.yaml
      - mise.toml
      - .mise/tasks/site/**
      - .github/workflows/site.yaml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Only the website's tools: the rest of mise.toml builds firmware.
      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm
      - run: mise run site:setup
      - run: mise run site:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
