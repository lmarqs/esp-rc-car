name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.message, ' '), '#site-release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm python http:arduino-cli
      - uses: actions/cache@v6
        with:
          path: .arduino
          key: arduino-${{ hashFiles('sketches/*/sketch.yaml', 'arduino-cli.yaml') }}
      - run: mise run node:setup
      - run: mise run arduino:firmware
      - run: mise run site:build
      - name: Fail when the build left no firmware manifest
        run: test -f site/dist/firmware/manifest.json
      - run: mise exec -- pnpm --filter @robomania/site exec playwright install-deps chromium
      - run: mise run site:test
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
