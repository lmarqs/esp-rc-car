[env]
_.file = ".env"
_.python.venv = { path = ".venv", create = true }
ARDUINO_CONFIG_FILE = "{{config_root}}/arduino-cli.yaml"


[tools]
node = "24.19.0"
python = "3.12"
uv = "0.11.25"
"github:lmarqs/the-cook" = "11.0.2"
"pipx:clang-format" = "23.1.5"

[tools."http:arduino-cli"]
version = "1.6.0"

[tools."http:arduino-cli".platforms]
linux-x64 = { url = "https://github.com/arduino/arduino-cli/releases/download/v{version}/arduino-cli_{version}_Linux_64bit.tar.gz" }
windows-x64 = { url = "https://github.com/arduino/arduino-cli/releases/download/v{version}/arduino-cli_{version}_Windows_64bit.zip" }
