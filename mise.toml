[env]
_.file = ".env"
_.python.venv = { path = ".venv", create = true }

[tools]
python = "3.10"
uv = "0.11.25"

[tools."http:arduino-cli"]
version = "1.6.0"

[tools."http:arduino-cli".platforms]
linux-x64 = { url = "https://github.com/arduino/arduino-cli/releases/download/v{version}/arduino-cli_{version}_Linux_64bit.tar.gz" }
windows-x64 = { url = "https://github.com/arduino/arduino-cli/releases/download/v{version}/arduino-cli_{version}_Windows_64bit.zip" }

[tasks."setup"]
description = "Create .env and sync the Python venv used by the board tools"
run = """
#!/usr/bin/env bash
set -euo pipefail

if [ ! -f ".env" ]; then
  cp .env.example .env
fi

uv sync --locked
"""

[tasks."arduino:hexdump"]
description = "Convert files in <sketch>/data into C headers"
usage = 'arg "<sketch>" help="Sketch folder"'
run = """
#!/usr/bin/env bash
set -euo pipefail

cd "${usage_sketch}"
if [ -d data ]; then
  find data -type f -not -name '*.h' -exec sh -c 'xxd --include "$1" > "$1.h"' _ {} \\;
fi
"""

[tasks."arduino:compile"]
description = "Compile a sketch with its default sketch.yaml profile"
usage = 'arg "<sketch>" help="Sketch folder"'
run = """
#!/usr/bin/env bash
set -euo pipefail

mise run arduino:hexdump "${usage_sketch}"
arduino-cli compile "${usage_sketch}" --build-path ".build/${usage_sketch}"
"""

[tasks."arduino:upload"]
description = "Upload a compiled sketch to the board"
usage = '''
arg "<sketch>" help="Sketch folder"
flag "-p --port <port>" env="PORT" help="Serial port of the board"
'''
run = """
#!/usr/bin/env bash
set -euo pipefail

sudo chmod a+rw "${usage_port}"
arduino-cli upload "${usage_sketch}" --input-dir ".build/${usage_sketch}" --port "${usage_port}"
"""

[tasks."arduino:monitor"]
description = "Open the serial monitor"
usage = '''
flag "-p --port <port>" env="PORT" help="Serial port of the board"
flag "--baudrate <baudrate>" default="9600"
flag "--describe" help="List the port settings instead of opening it"
'''
run = """
#!/usr/bin/env bash
set -euo pipefail

sudo chmod a+rw "${usage_port}"
if [ "${usage_describe:-false}" = "true" ]; then
  arduino-cli monitor --describe --port "${usage_port}"
else
  arduino-cli monitor --config "baudrate=${usage_baudrate}" --port "${usage_port}"
fi
"""

[tasks."arduino:run"]
description = "Compile, upload and monitor a sketch"
usage = '''
arg "<sketch>" help="Sketch folder"
flag "-p --port <port>" env="PORT" help="Serial port of the board"
'''
run = """
#!/usr/bin/env bash
set -euo pipefail

mise run arduino:compile "${usage_sketch}"
mise run arduino:upload "${usage_sketch}" --port "${usage_port}"
mise run arduino:monitor --port "${usage_port}"
"""

[tasks."clean"]
description = "Remove build output and installed cores and libraries"
run = "rm -rf .build .arduino"
